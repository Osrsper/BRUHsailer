name: Rebuild and deploy guide

# When to run:
#   - Every hour, on the hour (UTC) — picks up Google Docs edits automatically
#   - On any push to build.py, base.html, etc.
#   - Manually via the "Run workflow" button in the Actions tab
on:
  schedule:
    - cron: '0 * * * *'   # every hour at minute 0
  push:
    paths:
      - 'build.py'
      - 'base.html'
      - 'requirements.txt'
      - '.github/workflows/rebuild.yml'
  workflow_dispatch:

# contents: write  -> commit the rebuilt index.html back to the repo
# pages: write + id-token: write -> publish to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Standard GitHub Pages concurrency: one deploy at a time, never cancel a
# deploy that's mid-flight (cancelling can leave Pages in a broken state).
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # This environment is required for the Pages deploy action to work
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Always build from the latest main, not the commit that triggered the
      # run. A re-run of an older run would otherwise rebuild a stale commit
      # and then conflict with the rebuild it already pushed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest docx and rebuild index.html
        run: python build.py

      - name: Commit refreshed docx and index.html if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/ index.html
          if git diff --staged --quiet; then
            echo "No content changes since last run."
          else
            git commit -m "chore: auto-rebuild from Google Docs"
            # The re-downloaded docx files differ byte-for-byte on every run,
            # so if main moved on meanwhile they always conflict (binary).
            # In that case a newer rebuild is already on main: skip our commit
            # instead of failing the run, and still deploy below.
            if git pull --rebase origin main; then
              git push origin main
            else
              echo "::warning::main changed during this run and conflicts with this rebuild; skipping commit."
              git rebase --abort
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only the site itself, not the whole repo (template, build
      # script, cached docx files, old versions).
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html sitemap.xml _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      # deploy-pages sometimes queries for the uploaded artifact before GitHub
      # lists it ("Found 0 artifact(s)"), failing about half the runs. Give it
      # a moment and try once more before failing the run.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
